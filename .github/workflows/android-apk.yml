name: Build GHY GPT APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify Node.js
        run: |
          echo "Node version:"
          node -v
          echo "NPM version:"
          npm -v

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Java
        run: |
          echo "Java version:"
          java -version
          echo "Javac version:"
          javac -version

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Verify Capacitor
        run: |
          node -v
          npx cap --version

      - name: Initialize Capacitor
        run: npx cap init "GHY GPT" "com.theguwahati.ghygpt" --web-dir=dist

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GHY-GPT-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
